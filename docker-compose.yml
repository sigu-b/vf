version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: solar_maintenance_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: solar_maintenance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solar_maintenance_backend
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/solar_maintenance
      DEBUG: "True"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./simulator:/app/simulator
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (optional - can run locally with npm)
  # frontend:
  #   build:
  #     context: ./frontend
  #   container_name: solar_maintenance_frontend
  #   ports:
  #     - "5173:5173"
  #   volumes:
  #     - ./frontend:/app
  #   command: npm run dev

volumes:
  postgres_data:
